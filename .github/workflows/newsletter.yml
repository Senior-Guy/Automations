name: Hourly AI News

on:
  schedule:
    # Every hour at minute 7 (GitHub is busiest at minute 0, so this runs more reliably).
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: print the posts, send nothing, save nothing"
        type: boolean
        default: false

permissions:
  contents: write      # save the "already posted" history
  actions: write       # keep the hourly schedule from being auto-disabled

concurrency:
  group: ai-news
  # CRITICAL: Do not cancel in progress. If a heavy run takes 40 mins, 
  # the next hour's run will wait politely instead of killing it halfway.
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # CRITICAL: Increased to 55 mins to allow the firehose to finish processing 150+ items
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: newsletter/requirements.txt

      - run: pip install -r newsletter/requirements.txt

      - name: Find and post new stories
        run: python newsletter/newsletter.py
        env:
          # Secrets: Settings -> Secrets and variables -> Actions -> Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Optional variables: Settings -> Secrets and variables -> Actions -> Variables
          # Make sure these are set in GitHub if you want to override the defaults!
          KEYWORDS: ${{ vars.KEYWORDS }}
          HOURS_BACK: ${{ vars.HOURS_BACK }}
          MAX_POSTS: ${{ vars.MAX_POSTS }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          REQUIRE_IMAGE: ${{ vars.REQUIRE_IMAGE }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      - name: Save posted history
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add newsletter/state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No history changes to save."
          else
            git commit -m "chore: update posted history [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      # GitHub switches off scheduled workflows in public repos after 60 days without
      # activity. Re-enabling the workflow on every run resets that counter, so the
      # hourly schedule keeps itself alive with no clicking.
      - name: Keep the schedule alive
        if: ${{ always() }}
        continue-on-error: true
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/newsletter.yml/enable"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
